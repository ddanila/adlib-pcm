# DOSBox Staging config for adlib-pcm. Forces NukedOPL3 in OPL2-compat
# mode for cycle-accurate AdLib emulation: every TL register write
# from the timer ISR has to be honoured at the chip's internal sample
# rate or the PCM trick collapses to silence.

[sdl]
fullscreen = false

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
cputype = 386
cycles = max

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
sbmixer = true
oplmode = opl2
opl_fadeout = off

[autoexec]
mount C: build/dosbox
C:
ADLIB.EXE
exit
