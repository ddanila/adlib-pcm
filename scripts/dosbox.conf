# DOSBox Staging config for adlib-pcm. Forces NukedOPL3 in OPL2-compat
# mode for cycle-accurate AdLib emulation; QEMU's adlib device batches
# register writes, which kills any TL-modulation PCM trick. Use this
# config via `make run-dosbox`.

[sdl]
fullscreen = false

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
cputype = 386
cycles = max

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
sbmixer = true
oplmode = opl2
opl_fadeout = off

[autoexec]
mount C: build/dosbox
C:
ADLIB.EXE
exit
